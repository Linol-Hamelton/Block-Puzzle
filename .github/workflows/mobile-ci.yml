name: Mobile CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "firestore.rules"
      - "infra/firestore_rules_tests/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "firestore.rules"
      - "infra/firestore_rules_tests/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      # The google-services Gradle plugin is applied unconditionally, so every
      # Android build needs this file. It is gitignored on purpose (DEC-0015),
      # which means a clean runner has no copy and the Gradle task fails. The
      # secret holds the base64 of apps/mobile/android/app/google-services.json.
      - name: Provide Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set; the Android build cannot run." >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug


      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  firestore-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Firestore emulator refuses anything older than 21. This is not the
      # JDK the Android build uses; see infra/firestore_rules_tests/README.md.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: infra/firestore_rules_tests
        run: npm ci

      # Runs against the emulator, so it exercises the real rules engine. The
      # fixture is generated from the Dart model, which is what makes this
      # catch a client/rules mismatch rather than agree with itself.
      - name: Run rules deny/allow matrix
        working-directory: infra/firestore_rules_tests
        run: npm test
