name: Android Release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "App version name (e.g. 1.1.0)"
        required: true
        default: "1.0.1"
      build_number:
        description: "App version code (integer)"
        required: true
        default: "2"
      use_signing:
        description: "Use keystore secrets for release signing (true/false)"
        required: true
        default: "false"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode Android keystore
        if: ${{ inputs.use_signing == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ inputs.use_signing == 'true' }}
        run: |
          cat <<'EOF' > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # The google-services Gradle plugin is applied unconditionally, so every
      # Android build needs this file. It is gitignored on purpose (DEC-0015),
      # which means a clean runner has no copy and the Gradle task fails. The
      # secret holds the base64 of apps/mobile/android/app/google-services.json.
      - name: Provide Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set; the Android build cannot run." >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      # --dart-define is not optional here. AppConfig defaults to APP_ENV=dev
      # and APP_FLAVOR=debug, which makes the composition root resolve the debug
      # adapters: simulated purchases and no telemetry in a shipped binary.
      # configureDependencies() now throws in release mode if these are missing,
      # so a misconfigured build fails at startup rather than in the store.
      # See DEC-0007.
      - name: Build signed Android App Bundle
        run: >
          flutter build appbundle --release
          --dart-define=APP_ENV=prod
          --dart-define=APP_FLAVOR=release
          --dart-define=APP_VERSION="${{ inputs.build_name }}+${{ inputs.build_number }}"
          --build-name="${{ inputs.build_name }}"
          --build-number="${{ inputs.build_number }}"

      - name: Build signed Android APK
        run: >
          flutter build apk --release
          --dart-define=APP_ENV=prod
          --dart-define=APP_FLAVOR=release
          --dart-define=APP_VERSION="${{ inputs.build_name }}+${{ inputs.build_number }}"
          --build-name="${{ inputs.build_name }}"
          --build-number="${{ inputs.build_number }}"

      - name: Upload Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-android-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-android-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
